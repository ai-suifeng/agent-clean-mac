name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SPARKLE_VERSION: '2.10.0'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Install zstd
        run: brew install zstd

      - name: Test
        run: swift test

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: VERSION="${{ steps.version.outputs.value }}" scripts/build-app.sh --universal --dist

      - name: Sign update and write appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY is missing. Without it existing users would never see this release. See docs/RELEASING.md."
            exit 1
          fi
          v="${{ steps.version.outputs.value }}"
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP/sparkle"
          key="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          SPARKLE_BIN="$RUNNER_TEMP/sparkle/bin" scripts/make-appcast.sh "$v" "build/AgentSweep-$v.zip" \
            "https://github.com/${{ github.repository }}/releases/download/v$v/AgentSweep-$v.zip" "$key" > build/appcast.xml
          rm -f "$key"
          cat build/appcast.xml

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AgentSweep
          path: |
            build/AgentSweep-*.dmg
            build/AgentSweep-*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/AgentSweep-*.dmg
            build/AgentSweep-*.zip
            build/AgentSweep.dmg
            build/AgentSweep.zip
            build/appcast.xml
          generate_release_notes: true
          body: |
            Download `AgentSweep.dmg`, drag AgentSweep into Applications. The build is not notarized yet: right-click → Open on first launch, or run `xattr -dr com.apple.quarantine /Applications/AgentSweep.app`. Installed copies from 0.2.0 on update themselves.

            下载 `AgentSweep.dmg`，把 AgentSweep 拖进「应用程序」。安装包尚未公证：首次打开请右键选择「打开」，或运行 `xattr -dr com.apple.quarantine /Applications/AgentSweep.app`。0.2.0 及以后的版本会在应用内自动更新。
